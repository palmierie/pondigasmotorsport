<!doctype html>
<meta charset="utf-8">
<title>render tests</title>
<pre id="out">running…</pre>
<script type="module">
import * as R from "./render.js";
const out = [];
let failed = 0;
function t(name, fn) {
  try { fn(); out.push("PASS " + name); }
  catch (e) { failed++; out.push("FAIL " + name + ": " + e.message); }
}
const eq = (a, b) => { if (a !== b) throw new Error(`expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`); };
const ok = (c, m) => { if (!c) throw new Error(m); };
const d = (s) => new Date(s + "T12:00:00");

const L = { name: "The League", season: "Season 04", presentedBy: "Presented by Foxxtecca", tagline: "Tagline here", facts: [{ label: "Class", value: "GT3" }], timeline: [{ label: "Race", time: "7:10 PM" }], timeZone: "ET", links: [{ label: "Watch live", url: "https://y.com", primary: true }, { label: "Site", url: "https://s.com" }], partners: [{ role: "Broadcast", name: "Apex" }], logos: [{ name: "Foxx", src: "/a.webp" }], disclaimer: "Not affiliated." };
t("league renders name and season", () => { const h = R.renderLeague(L); ok(h.includes("The League") && h.includes("Season 04"), h); });
t("league facts render as definition list", () => { const h = R.renderLeague(L); ok(h.includes('<dl class="facts">') && h.includes("<dt>Class</dt><dd>GT3</dd>"), h); });
t("league timeline appends the time zone", () => ok(R.renderLeague(L).includes("7:10 PM ET"), "no zone"));
t("league omits timeline when absent", () => { const { timeline, ...rest } = L; ok(!R.renderLeague(rest).includes("timeline"), "present"); });
t("league escapes html in text", () => { const h = R.renderLeague({ ...L, name: "<b>x</b>" }); ok(!h.includes("<b>x"), h); });
t("league skips links with non-https urls", () => {
  const h = R.renderLeague({ ...L, links: [{ label: "Bad", url: "javascript:alert(1)" }, { label: "Worse", url: "www.x.com" }, { label: "Good", url: "https://g.com" }] });
  ok(!h.includes("javascript") && !h.includes("www.x.com") && !h.includes(">Bad<") && h.includes('href="https://g.com"'), h);
});
t("league primary link is a green button", () => ok(R.renderLeague(L).includes('<a class="btn" href="https://y.com" target="_blank" rel="noopener">Watch live<span class="visually-hidden"> (opens in a new tab)</span></a>'), R.renderLeague(L)));
t("league links all open in a new tab with noopener", () => {
  const h = R.renderLeague(L);
  const anchors = h.match(/<a [^>]*href="https:[^>]*>/g) || [];
  ok(anchors.length === 2 && anchors.every((a) => a.includes('target="_blank"') && a.includes('rel="noopener"')), h);
});
t("league new-tab links tell screen readers", () => {
  const h = R.renderLeague(L);
  eq(h.split("(opens in a new tab)").length - 1, 2);
});
t("league logo has name fallback text", () => { const h = R.renderLeague(L); ok(h.includes("data-logo") && h.includes('class="visually-hidden">Foxx<'), h); });
t("league with only name and season renders without undefined", () => { const h = R.renderLeague({ name: "N", season: "S" }); ok(h.includes("N") && !h.includes("undefined") && !h.includes("null") && !h.includes("<dl") && !h.includes("<ol"), h); });
t("empty league object renders nothing", () => eq(R.renderLeague({}), ""));
const LG = "/assets/tracks/road-atlanta.webp";
t("schedule row with logo renders a logo tile", () => {
  const h = R.renderSchedule({ races: [{ event: "R1", venue: "V", date: "2027-02-01", logo: LG }] }, d("2027-01-01"));
  ok(h.includes('<li class="row box has-logo"><span class="row-logo"><img src="' + LG + '" alt="" data-logo></span>'), h);
});
t("schedule row without logo renders no tile", () => {
  const h = R.renderSchedule({ races: [{ event: "R1", venue: "V", date: "2027-02-01" }] }, d("2027-01-01"));
  ok(!h.includes("row-logo") && !h.includes("has-logo") && h.includes('<li class="row box">') && !h.includes("undefined"), h);
});
t("logo path is escaped in the attribute", () => {
  const h = R.renderSchedule({ races: [{ event: "R1", venue: "V", date: "2027-02-01", logo: '/x.webp" onerror="alert(1)<b>' }] }, d("2027-01-01"));
  ok(!h.includes('" onerror="') && !h.includes("<b>"), h);
});
t("next race feature shows the logo tile", () => {
  const h = R.renderNextRace({ races: [{ event: "R1", venue: "V", date: "2027-02-01", logo: LG }] }, d("2027-01-01"));
  ok(h.includes('class="box feature has-logo"') && h.includes('<span class="row-logo">'), h);
});
t("results rows never get a tile", () => {
  const h = R.renderResults({ seasons: [{ year: 2026, races: [{ event: "E", venue: "V", date: "2026-03-01", logo: LG }] }] });
  ok(!h.includes("row-logo") && !h.includes("has-logo"), h);
});
t("latest result shows the logo tile when it has a logo", () => {
  const h = R.renderLatestResult({ seasons: [{ year: 2026, races: [{ event: "E", venue: "V", date: "2026-03-01", logo: LG }] }] });
  ok(h.includes('class="box feature has-logo"') && h.includes('<span class="row-logo"><img src="' + LG + '" alt="" data-logo></span>'), h);
});
t("latest result without a logo renders no tile", () => {
  const h = R.renderLatestResult({ seasons: [{ year: 2026, races: [{ event: "E", venue: "V", date: "2026-03-01" }] }] });
  ok(!h.includes("row-logo") && !h.includes("has-logo") && !h.includes("undefined"), h);
});
const YT = "https://www.youtube.com/@x/live";
const wRound = { event: "R1", venue: "V", date: "2027-02-01" };
t("schedule row shows a Watch button with the default link", () => {
  const h = R.renderSchedule({ watchUrl: YT, races: [wRound] }, d("2027-01-01"));
  ok(h.includes('<span class="row-watch"><a class="btn watch-btn" href="' + YT + '" target="_blank" rel="noopener">Watch<span class="visually-hidden"> (opens in a new tab)</span></a></span>') && h.includes("has-watch"), h);
});
t("round watch link overrides the default", () => {
  const h = R.renderSchedule({ watchUrl: YT, races: [{ ...wRound, watch: "https://www.youtube.com/watch?v=abc" }] }, d("2027-01-01"));
  ok(h.includes('href="https://www.youtube.com/watch?v=abc"') && !h.includes(YT), h);
});
t("no watch link means no button", () => {
  const h = R.renderSchedule({ races: [wRound] }, d("2027-01-01"));
  ok(!h.includes("watch-btn") && !h.includes("has-watch") && !h.includes("row-watch") && !h.includes("undefined"), h);
});
t("non-https watch links are not rendered", () => {
  const none = R.renderSchedule({ watchUrl: "www.x.com", races: [{ ...wRound, watch: "javascript:alert(1)" }] }, d("2027-01-01"));
  ok(!none.includes("watch-btn") && !none.includes("javascript"), none);
  const fallback = R.renderSchedule({ watchUrl: YT, races: [{ ...wRound, watch: "javascript:alert(1)" }] }, d("2027-01-01"));
  ok(fallback.includes('href="' + YT + '"') && !fallback.includes("javascript"), fallback);
});
t("watch link opens in a new tab with noopener and screen reader text", () => {
  const h = R.renderSchedule({ watchUrl: YT, races: [wRound] }, d("2027-01-01"));
  ok(h.includes('target="_blank"') && h.includes('rel="noopener"') && h.includes("(opens in a new tab)"), h);
});
t("watch url is escaped in the attribute", () => {
  const h = R.renderSchedule({ watchUrl: YT, races: [{ ...wRound, watch: 'https://x.com/"onmouseover="alert(1)<b>' }] }, d("2027-01-01"));
  ok(!h.includes('"onmouseover="') && !h.includes("<b>"), h);
});
t("results row shows a Watch replay button", () => {
  const h = R.renderResults({ watchUrl: "https://www.youtube.com/@x/streams", seasons: [{ year: 2026, races: [{ event: "E", venue: "V", date: "2026-03-01" }] }] });
  ok(h.includes(">Watch replay<span") && h.includes("has-watch") && h.includes('href="https://www.youtube.com/@x/streams"'), h);
});
t("next race feature shows a Watch button", () => {
  const h = R.renderNextRace({ watchUrl: YT, races: [wRound] }, d("2027-01-01"));
  ok(h.includes('class="box feature has-watch"') && h.includes(">Watch<span"), h);
});
t("latest result feature shows a Watch replay button", () => {
  const h = R.renderLatestResult({ watchUrl: "https://www.youtube.com/@x/streams", seasons: [{ year: 2026, races: [{ event: "E", venue: "V", date: "2026-03-01" }] }] });
  ok(h.includes('class="box feature has-watch"') && h.includes(">Watch replay<span"), h);
});
t("watch button is not nested inside the title link", () => {
  const h = R.renderSchedule({ watchUrl: YT, races: [{ ...wRound, link: "https://r.com" }] }, d("2027-01-01"));
  const start = h.indexOf('<a href="https://r.com"'), end = h.indexOf("</a>", start);
  ok(start !== -1 && !h.slice(start, end).includes("watch-btn") && h.includes("watch-btn"), h);
});
t("schedule row shows label, time and zone", () => {
  const h = R.renderSchedule({ timeLabel: "Race", timeZone: "ET", races: [{ event: "R1", venue: "V", date: "2027-01-05", time: "19:10" }] }, d("2027-01-01"));
  ok(h.includes("Tue, Jan 5, 2027 · Race 7:10 PM ET"), h);
});
t("time without label or zone shows only the time", () => {
  const h = R.renderSchedule({ races: [{ event: "R1", venue: "V", date: "2027-01-05", time: "18:00" }] }, d("2027-01-01"));
  ok(h.includes("· 6:00 PM<") && !h.includes("ET") && !h.includes("Race"), h);
});
t("zone without a round time shows no zone or label", () => {
  const h = R.renderSchedule({ timeLabel: "Race", timeZone: "ET", races: [{ event: "R1", venue: "V", date: "2027-01-05" }] }, d("2027-01-01"));
  ok(!h.includes("ET") && !h.includes("Race") && !h.includes("undefined"), h);
});
t("next race feature shows label, time and zone", () => {
  const h = R.renderNextRace({ timeLabel: "Race", timeZone: "ET", races: [{ event: "R1", venue: "V", date: "2027-01-05", time: "19:10" }] }, d("2027-01-01"));
  ok(h.includes("Race 7:10 PM ET"), h);
});
t("schedule renders an ordered list of rows", () => {
  const h = R.renderSchedule({ races: [{ event: "A", venue: "V", date: "2027-02-01" }, { event: "B", venue: "V", date: "2027-03-01" }] }, d("2027-01-01"));
  ok(h.includes('<ol class="rows">'), h);
  eq(h.split('<li class="row box">').length - 1, 2);
});
t("row has date, title and venue spans in order", () => {
  const h = R.renderSchedule({ races: [{ event: "Round 1", venue: "Road Atlanta", date: "2027-02-01" }] }, d("2027-01-01"));
  const a = h.indexOf('<span class="row-date">'), b = h.indexOf('<span class="row-title">'), c = h.indexOf('<span class="row-venue">');
  ok(a !== -1 && a < b && b < c, h);
});
t("result row omits meta when class and position are absent", () => {
  const h = R.renderResults({ seasons: [{ year: 2026, races: [{ event: "E", venue: "V", date: "2026-03-01" }] }] });
  ok(!h.includes("row-meta") && !h.includes("row-notes") && !h.includes("undefined"), h);
});
t("result row shows meta joined by a middle dot", () => {
  const h = R.renderResults({ seasons: [{ year: 2026, races: [{ event: "E", venue: "V", date: "2026-03-01", class: "Class A", position: "P1" }] }] });
  ok(h.includes('<span class="row-meta">Class A · P1</span>'), h);
});
t("next race renders a feature box", () => {
  const h = R.renderNextRace({ races: [{ event: "Soon", venue: "V", date: "2027-02-01" }] }, d("2027-01-01"));
  ok(h.includes('class="box feature"') && h.includes("Soon"), h);
});
t("sponsors render as cells", () => {
  const h = R.renderSponsors({ sponsors: [{ name: "Acme" }] });
  ok(h.includes('<ul class="cells">') && h.includes('<li class="cell box">'), h);
});
t("schedule shows start time as 12-hour clock", () => {
  const h = R.renderSchedule({ races: [{ event: "R1", venue: "V", date: "2027-01-05", time: "18:00" }] }, d("2027-01-01"));
  ok(h.includes("6:00 PM"), h);
});
t("noon and midnight format correctly", () => {
  const n = R.renderSchedule({ races: [{ event: "R1", venue: "V", date: "2027-01-05", time: "12:30" }] }, d("2027-01-01"));
  const m = R.renderSchedule({ races: [{ event: "R1", venue: "V", date: "2027-01-05", time: "00:05" }] }, d("2027-01-01"));
  ok(n.includes("12:30 PM") && m.includes("12:05 AM"), n + m);
});
t("schedule without time shows no time", () => {
  const h = R.renderSchedule({ races: [{ event: "R1", venue: "V", date: "2027-01-05" }] }, d("2027-01-01"));
  ok(!h.includes("AM") && !h.includes("PM") && !h.includes("undefined"), h);
});
t("dates show weekday in US style", () => {
  const h = R.renderSchedule({ races: [{ event: "R1", venue: "V", date: "2026-11-24" }] }, d("2026-11-01"));
  ok(h.includes("Tue, Nov 24, 2026"), h);
});
t("empty results shows message", () => ok(R.renderResults({ seasons: [] }).includes("No results yet."), "no msg"));
t("empty schedule shows message", () => ok(R.renderSchedule({ races: [] }, d("2027-01-01")).includes("No upcoming races."), "no msg"));
t("race today is upcoming", () => ok(R.renderSchedule({ races: [{ event: "Today", venue: "V", date: "2027-01-01" }] }, d("2027-01-01")).includes("Today"), "missing"));
t("race yesterday is excluded", () => ok(!R.renderSchedule({ races: [{ event: "Old", venue: "V", date: "2026-12-31" }] }, d("2027-01-01")).includes("Old"), "present"));
t("multi-day race still running is upcoming", () => ok(R.renderSchedule({ races: [{ event: "Long", venue: "V", date: "2026-12-31", endDate: "2027-01-02" }] }, d("2027-01-01")).includes("Long"), "missing"));
t("schedule sorted ascending", () => {
  const h = R.renderSchedule({ races: [{ event: "B", venue: "V", date: "2027-06-01" }, { event: "A", venue: "V", date: "2027-02-01" }] }, d("2027-01-01"));
  ok(h.indexOf(">A<") !== -1 && h.indexOf(">A<") < h.indexOf(">B<"), h);
});
t("missing optional fields never print undefined", () => {
  const h = R.renderResults({ seasons: [{ year: 2026, races: [{ event: "E", venue: "V", date: "2026-03-01" }] }] });
  ok(!h.includes("undefined") && !h.includes("null"), h);
});
t("sponsor without logo renders name", () => ok(R.renderSponsors({ sponsors: [{ name: "Acme" }] }).includes("Acme"), "no name"));
t("sponsor with logo renders img with alt", () => { const h = R.renderSponsors({ sponsors: [{ name: "Acme", logo: "/assets/logos/a.png" }] }); ok(h.includes("<img") && h.includes('alt="Acme"'), h); });
t("sponsor with logo also carries its name as fallback text", () => {
  const h = R.renderSponsors({ sponsors: [{ name: "Acme", logo: "/assets/logos/a.png" }] });
  ok(h.includes('data-logo') && h.includes('class="sponsor-name visually-hidden">Acme<'), h);
});
t("sponsor without logo shows name unhidden", () => {
  const h = R.renderSponsors({ sponsors: [{ name: "Acme" }] });
  ok(h.includes('class="sponsor-name">Acme<') && !h.includes("visually-hidden"), h);
});
t("sponsor with url is linked", () => ok(R.renderSponsors({ sponsors: [{ name: "Acme", url: "https://a.com" }] }).includes('href="https://a.com"'), "no link"));
t("empty sponsors shows message", () => ok(R.renderSponsors({ sponsors: [] }).includes("empty"), "no msg"));
t("script in event name is escaped", () => ok(!R.renderResults({ seasons: [{ year: 2026, races: [{ event: "<scr" + "ipt>x</scr" + "ipt>", venue: "V", date: "2026-03-01" }] }] }).includes("<scr" + "ipt>"), "unescaped"));
t("escapeHtml escapes quotes and ampersand", () => eq(R.escapeHtml(`&"<>'`), "&amp;&quot;&lt;&gt;&#39;"));
t("seasons newest first", () => {
  const h = R.renderResults({ seasons: [{ year: 2024, races: [] }, { year: 2026, races: [] }] });
  ok(h.indexOf("2026") < h.indexOf("2024"), "order");
});
t("next race picks earliest upcoming", () => {
  const h = R.renderNextRace({ races: [{ event: "Later", venue: "V", date: "2027-06-01" }, { event: "Sooner", venue: "V", date: "2027-02-01" }] }, d("2027-01-01"));
  ok(h.includes("Sooner") && !h.includes("Later"), h);
});
t("next race empty message", () => ok(R.renderNextRace({ races: [] }, d("2027-01-01")).includes("empty"), "no msg"));
t("latest result picks most recent race", () => {
  const h = R.renderLatestResult({ seasons: [{ year: 2026, races: [{ event: "Early", venue: "V", date: "2026-01-01" }, { event: "Recent", venue: "V", date: "2026-09-01" }] }] });
  ok(h.includes("Recent") && !h.includes("Early"), h);
});
t("latest result empty message", () => ok(R.renderLatestResult({ seasons: [] }).includes("empty"), "no msg"));

document.getElementById("out").textContent = out.join("\n") + `\n\n${failed ? "FAILED: " + failed : "ALL PASS"}`;
document.title = failed ? "FAIL" : "PASS";
</script>
